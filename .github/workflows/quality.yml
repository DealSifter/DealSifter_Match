name: Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - main
      - release/**
      - safe-push

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Clean install, audit, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder
      VITE_APP_URL: https://ci.dealsifter.invalid
      VITE_STRIPE_PRICE_P5: price_ci_p5
      VITE_STRIPE_PRICE_P15: price_ci_p15
      VITE_STRIPE_PRICE_P40: price_ci_p40
      VITE_STRIPE_PRICE_P100: price_ci_p100
      VITE_STRIPE_PRICE_PLAN_PRO: price_ci_plan_pro
      VITE_STRIPE_PRICE_PLAN_ENTERPRISE: price_ci_plan_enterprise
      VITE_STRIPE_PRICE_PLAN_PRO_YEAR: price_ci_plan_pro_year
      VITE_STRIPE_PRICE_PLAN_ENTERPRISE_YEAR: price_ci_plan_enterprise_year

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Run complete local quality gate
        run: npm run quality

      - name: Validate repair release manifest and heartbeat contract
        run: |
          npm run audit:release
          npm run heartbeat:contract
          npm run test:maxxis:acceptance:contract

      - name: Enforce deterministic performance budgets
        run: node scripts/audit-performance.mjs

      - name: Enforce architecture boundaries
        run: npm run audit:architecture

      - name: Enforce generated contract and feature readiness gates
        run: |
          npm run audit:types
          npm run audit:feature-readiness

  e2e:
    name: Browser E2E quality gate
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      CI: true
      E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://127.0.0.1:4180
      E2E_SUPABASE_URL: http://127.0.0.1:54321
      E2E_SUPABASE_ANON_KEY: ci-e2e-public-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Start E2E app server
        env:
          VITE_APP_URL: http://127.0.0.1:4180
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-e2e-public-placeholder
          VITE_STRIPE_PRICE_P5: price_e2e_p5
          VITE_STRIPE_PRICE_P15: price_e2e_p15
          VITE_STRIPE_PRICE_P40: price_e2e_p40
          VITE_STRIPE_PRICE_P100: price_e2e_p100
          VITE_STRIPE_PRICE_PLAN_PRO: price_e2e_plan_pro
          VITE_STRIPE_PRICE_PLAN_ENTERPRISE: price_e2e_plan_enterprise
        run: |
          npm run dev:e2e > /tmp/dealsifter-e2e-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4180 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dealsifter-e2e-vite.log
          exit 1

      - name: Run safe browser E2E suite
        run: npm run test:e2e:ci

      - name: Run deterministic UI non-regression contract
        run: npm run audit:ui-structural

      - name: Run mobile viewport E2E suite
        run: npm run test:e2e:mobile

      - name: Run accessibility and keyboard E2E suite
        run: npm run test:e2e:accessibility

  e2e-integration:
    name: Real backend and Maxxis staging release gate
    runs-on: ubuntu-latest
    needs: [validate, e2e]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: staging
    timeout-minutes: 40
    env:
      CI: true
      TARGET_ENV: staging
      E2E_BACKEND_MODE: real
      E2E_LLM_MODE: real
      E2E_RUN_ID: ci-real-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://127.0.0.1:4181
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: oqdcnjupquhybwdbeeew
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      VITE_APP_URL: http://127.0.0.1:4181
      VITE_STRIPE_PRICE_P5: price_ci_p5
      VITE_STRIPE_PRICE_P15: price_ci_p15
      VITE_STRIPE_PRICE_P40: price_ci_p40
      VITE_STRIPE_PRICE_P100: price_ci_p100
      VITE_STRIPE_PRICE_PLAN_PRO: price_ci_plan_pro
      VITE_STRIPE_PRICE_PLAN_ENTERPRISE: price_ci_plan_enterprise
      VITE_STRIPE_PRICE_PLAN_PRO_YEAR: price_ci_plan_pro_year
      VITE_STRIPE_PRICE_PLAN_ENTERPRISE_YEAR: price_ci_plan_enterprise_year

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.30.4
          github-token: ${{ github.token }}

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Detect staging schema and generated type drift
        run: npm run audit:types:remote

      - name: Start real-backend E2E app server
        run: |
          npm run dev:e2e:integration > /tmp/dealsifter-e2e-integration-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4181 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dealsifter-e2e-integration-vite.log
          exit 1

      - name: Run real backend E2E integration suite
        run: npm run test:e2e:integration

      - name: Run mandatory Maxxis real-runtime staging acceptance
        run: npm run gate:maxxis:staging:variance

      - name: Upload sanitized Maxxis heartbeat evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maxxis-staging-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/heartbeat/heartbeat-*.json
          if-no-files-found: warn
          retention-days: 30
